<div class="section-skills content">
    <div class="row justify-content-center">
        <ng-container *ngFor="let skills of skillsList; let i = index">
            <div class="col-12 col-md-6 col-lg-4 margin-big-top">
                <div class="card section-skills_card">
                    <span class="section-skills_card_title text-accent margin-medium-bottom">{{skills.group}}</span>
                    <div class="section-skills_card_container">
                        <ng-container *ngFor="let skill of skills.skills">
                            <app-dynamic-bar [item]="skill"></app-dynamic-bar>
                        </ng-container>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</div>
